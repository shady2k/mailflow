name: Publish to GHCR

on:
  push:
    branches:
      - 'feat/unicode-body-search-and-inbox-layout'
      - 'test/integrated-indexing-cache-locale'
      - 'fix/search-pending-feedback'
      - 'fix/category-total-counts'
      - 'fix/systemic-integration-v2'
      - 'integration/upstream-20261013'
      - 'integration/upstream-20261016'
      - 'fix/ai-actions-full-text-20261016'
      - 'fix/resume-ai-cache-20261016'
      - 'fix/background-pwa-badge-20261016'
      - 'fix/list-window-recovery-20261013'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailflow-backend
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # Prerelease tags (v3.5.9-beta.1) must never repoint `latest`: everyone on the
            # stock compose file pulls latest, and a beta exists precisely because it is
            # not for them yet. The semver patterns already skip prereleases on their own.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=test-${{ github.sha }},enable=${{ github.ref == 'refs/heads/feat/unicode-body-search-and-inbox-layout' || github.ref == 'refs/heads/test/integrated-indexing-cache-locale' || github.ref == 'refs/heads/fix/search-pending-feedback' || github.ref == 'refs/heads/fix/category-total-counts' || github.ref == 'refs/heads/fix/systemic-integration-v2' || github.ref == 'refs/heads/integration/upstream-20261013' || github.ref == 'refs/heads/integration/upstream-20261016' || github.ref == 'refs/heads/fix/ai-actions-full-text-20261016' || github.ref == 'refs/heads/fix/resume-ai-cache-20261016' || github.ref == 'refs/heads/fix/background-pwa-badge-20261016' || github.ref == 'refs/heads/fix/list-window-recovery-20261013' }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailflow-frontend
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # Prerelease tags (v3.5.9-beta.1) must never repoint `latest`: everyone on the
            # stock compose file pulls latest, and a beta exists precisely because it is
            # not for them yet. The semver patterns already skip prereleases on their own.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=test-${{ github.sha }},enable=${{ github.ref == 'refs/heads/feat/unicode-body-search-and-inbox-layout' || github.ref == 'refs/heads/test/integrated-indexing-cache-locale' || github.ref == 'refs/heads/fix/search-pending-feedback' || github.ref == 'refs/heads/fix/category-total-counts' || github.ref == 'refs/heads/fix/systemic-integration-v2' || github.ref == 'refs/heads/integration/upstream-20261013' || github.ref == 'refs/heads/integration/upstream-20261016' || github.ref == 'refs/heads/fix/ai-actions-full-text-20261016' || github.ref == 'refs/heads/fix/resume-ai-cache-20261016' || github.ref == 'refs/heads/fix/background-pwa-badge-20261016' || github.ref == 'refs/heads/fix/list-window-recovery-20261013' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
