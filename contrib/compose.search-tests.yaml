name: mailflow-fork-search-tests
services:
  pg16:
    image: postgres:16-alpine
    environment: &db-env
      POSTGRES_USER: search_test
      POSTGRES_PASSWORD: public-synthetic-test
      POSTGRES_DB: search_test
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    tmpfs: [/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: &health
      test: [CMD-SHELL, pg_isready -U search_test -d search_test]
      interval: 2s
      retries: 30
  pg18:
    image: postgres:18-alpine
    environment: *db-env
    tmpfs: [/var/lib/postgresql]
    networks: [internal]
    healthcheck: *health
  test16:
    image: node:22-bookworm-slim
    working_dir: /repo/backend
    volumes: ["..:/repo:ro"]
    environment:
      SEARCH_TEST_DATABASE_URL: postgres://search_test:public-synthetic-test@pg16/search_test
    command: [node, --test, src/services/unicodeSearch.postgres.mjs, src/services/aiHeaders.postgres.mjs]
    depends_on:
      pg16: {condition: service_healthy}
    networks: [internal]
  test18:
    image: node:22-bookworm-slim
    working_dir: /repo/backend
    volumes: ["..:/repo:ro"]
    environment:
      SEARCH_TEST_DATABASE_URL: postgres://search_test:public-synthetic-test@pg18/search_test
    command: [node, --test, src/services/unicodeSearch.postgres.mjs, src/services/aiHeaders.postgres.mjs]
    depends_on:
      pg18: {condition: service_healthy}
    networks: [internal]
networks:
  internal:
    internal: true
